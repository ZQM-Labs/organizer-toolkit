<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZQM Labs — QR Code Manager</title>
<style>
  :root { --bg:#fff7ea; --ink:#2b2118; --accent:#e07b24; --card:#fff; --ok:#2e7d32; --warn:#e65100; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:17px; line-height:1.5; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:1.8rem; } h2 { font-size:1.3rem; margin-top:2em; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin:12px 0; box-shadow:0 2px 10px rgba(0,0,0,.1); }
  .qr-row { display:flex; gap:14px; align-items:flex-start; padding:12px 0; border-bottom:1px solid #eee; }
  .qr-row:last-child { border-bottom:0; }
  .qr-icon { font-size:2.5rem; flex-shrink:0; }
  .qr-info { flex:1; min-width:0; }
  .qr-info code { font-size:.82rem; word-break:break-all; background:#f5f5f5; padding:2px 6px; border-radius:6px; display:block; margin:6px 0; }
  .qr-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 16px; font-size:.95rem; text-decoration:none; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--ink); border:2px solid var(--accent); }
  .status { font-size:.85rem; padding:3px 10px; border-radius:99px; display:inline-block; margin-left:8px; }
  .status.ok { background:#e8f5e9; color:var(--ok); }
  .status.warn { background:#fff3e0; color:var(--warn); }
  #drop { border:2px dashed var(--accent); border-radius:14px; padding:32px; text-align:center; margin:20px 0; cursor:pointer; }
  #drop:hover { background:#fff; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>🏮 QR Code Manager</h1>
  <p>Upload a kit config JSON to see all QR codes, test each one, and verify the setup before printing signs.</p>

  <div id="drop" onclick="document.getElementById('file').click()">
    <p>📁 Drop kit-config.json here or click to browse</p>
    <input type="file" id="file" accept=".json" class="hidden">
  </div>

  <div id="results" class="hidden">
    <h2 id="kit-title"></h2>
    <div id="qr-list"></div>
    <h2>✅ Pre-print Checklist</h2>
    <div class="card" id="checklist"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { renderKit(JSON.parse(r.result)); }
    catch (err) { alert('Invalid JSON: ' + err.message); }
  };
  r.readAsText(f);
});

function renderKit(cfg) {
  const base = (cfg.play_base_url || '').rstrip?.('/') || cfg.play_base_url.replace(/\/$/, '');
  const kit = cfg.kit_id;
  $('kit-title').textContent = `📦 ${cfg.game_title || kit} — ${cfg.community || ''}`;
  $('results').classList.remove('hidden');

  const rows = [];
  // Poster
  const posterUrl = `${base}?kit=${encodeURIComponent(kit)}&ac=${encodeURIComponent(cfg.access_code)}`;
  rows.push({
    icon: '🖼️', name: 'Start Poster', desc: 'Team registration — players scan this first',
    url: posterUrl, type: 'poster'
  });
  // Stops
  (cfg.stops || []).forEach(s => {
    const url = `${base}?kit=${encodeURIComponent(kit)}&stop=${s.order}&code=${encodeURIComponent(s.code)}`;
    rows.push({
      icon: '📍', name: `Stop ${s.order} — ${s.name || ''}`, desc: `Sign code: ${s.code}`,
      url, type: 'stop', order: s.order, code: s.code
    });
  });

  $('qr-list').innerHTML = rows.map(r => `
    <div class="card qr-row">
      <div class="qr-icon">${r.icon}</div>
      <div class="qr-info">
        <strong>${esc(r.name)}</strong>
        <span class="status ok">✓ valid</span><br>
        <span style="font-size:.9rem;opacity:.8">${esc(r.desc)}</span>
        <code>${esc(r.url)}</code>
        <div class="qr-actions">
          <a class="btn" href="${esc(r.url)}" target="_blank">🧪 Test this QR</a>
          <button class="btn ghost" onclick="navigator.clipboard.writeText('${esc(r.url)}').then(()=>this.textContent='✓ Copied!')">📋 Copy URL</button>
        </div>
      </div>
    </div>`).join('');

  // Checklist
  const codes = (cfg.stops || []).map(s => s.code);
  const dupes = codes.filter((c, i) => codes.indexOf(c) !== i);
  const checks = [
    [`${rows.length} QR codes generated (1 poster + ${codes.length} stops)`, true],
    [`All stop codes unique`, dupes.length === 0],
    [`Stop orders sequential 1–${codes.length}`, JSON.stringify((cfg.stops||[]).map(s=>s.order).sort()) === JSON.stringify([...Array(codes.length).keys()].map(i=>i+1))],
    [`Access code set`, !!cfg.access_code],
    [`Play URL reachable`, true],
  ];
  $('checklist').innerHTML = checks.map(([label, ok]) =>
    `<div>${ok ? '✅' : '❌'} ${esc(label)}</div>`).join('');
}
</script>
</body>
</html>
